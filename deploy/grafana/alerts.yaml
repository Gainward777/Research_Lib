groups:
  - name: research-library-slo
    interval: 1m
    rules:
      - alert: ResearchLibrarySearchErrorRatioHigh
        expr: |
          sum by (service, environment, project) (
            rate(memento_context_search_requests_total{outcome=~"gbrain_error|internal_error"}[10m])
          )
          /
          clamp_min(
            sum by (service, environment, project) (
              rate(memento_context_search_requests_total[10m])
            ),
            0.001
          ) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Research Library search error ratio exceeds 5%"
          description: "Inspect Railway logs for service={{ $labels.service }}, project={{ $labels.project }} in the last 10 minutes."
      - alert: ResearchLibraryPublishErrorRatioHigh
        expr: |
          sum by (service, environment, project) (
            rate(memento_context_publish_requests_total{outcome=~"gbrain_error|internal_error"}[10m])
          )
          /
          clamp_min(
            sum by (service, environment, project) (
              rate(memento_context_publish_requests_total[10m])
            ),
            0.001
          ) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Research Library publish error ratio exceeds 5%"
          description: "Inspect Railway logs for service={{ $labels.service }}, project={{ $labels.project }} in the last 10 minutes."
      - alert: ResearchLibraryGBrainTimeouts
        expr: |
          sum by (service, environment) (
            increase(gbrain_operation_requests_total{outcome="timeout"}[10m])
          ) >= 3
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "GBrain timed out at least three times in 10 minutes"
          description: "Inspect Railway logs for service={{ $labels.service }} in the last 10 minutes."
      - alert: ResearchLibrarySearchP95High
        expr: |
          histogram_quantile(
            0.95,
            sum by (service, environment, project, le) (
              rate(memento_context_search_duration_seconds_bucket[15m])
            )
          ) > 10
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Memento search p95 exceeds 10 seconds"
          description: "Inspect Railway logs for service={{ $labels.service }}, project={{ $labels.project }} in the last 15 minutes."
      - alert: ResearchLibraryPublishP95High
        expr: |
          histogram_quantile(
            0.95,
            sum by (service, environment, project, le) (
              rate(memento_context_publish_duration_seconds_bucket[15m])
            )
          ) > 10
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Memento publish p95 exceeds 10 seconds"
          description: "Inspect Railway logs for service={{ $labels.service }}, project={{ $labels.project }} in the last 15 minutes."
      - alert: ResearchLibraryPendingIndexTooOld
        expr: library_oldest_pending_index_age_seconds > 600
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Oldest Research Library index job is older than 10 minutes"
          description: "Inspect Railway logs for service={{ $labels.service }} in the last 15 minutes."
